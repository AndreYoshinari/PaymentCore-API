
services:
  postgres:
    image: postgres:16-alpine
    container_name: payment-core-db
    environment:
      POSTGRES_DB: payment_core
      POSTGRES_USER: payment_user
      POSTGRES_PASSWORD: payment_password
    ports:
      - "5432:5432"
    volumes:
      - payment_core_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U payment_user -d payment_core"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    image: payment-core-api
    container_name: payment-core-api
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DB_URL: jdbc:postgresql://postgres:5432/payment_core
      DB_USERNAME: payment_user
      DB_PASSWORD: payment_password
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-15m}
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/actuator/health | grep -q UP"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

volumes:
  payment_core_data:
