spring.application.name=payment-core

# Database
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/payment_core}
spring.datasource.username=${DB_USERNAME:payment_user}
spring.datasource.password=${DB_PASSWORD:payment_password}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Flyway
spring.flyway.enabled=true

# Errors
server.error.include-stacktrace=never
server.error.include-message=never
server.error.include-binding-errors=never
